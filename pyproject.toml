[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supernovabets"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "httpx",
    "joblib",
    "lightgbm",
    "nba_api",
    "numpy",
    "pandas",
    "pillow",
    "psycopg2-binary",
    "pydantic-settings>=2",
    "pytest",
    "requests",
    "scipy",
    "scikit-learn",
    "sqlalchemy>=2",
    "streamlit>=1.40",
    "typer>=0.12",
    "xgboost",
]

[project.scripts]
sniper = "sports_sniper.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sports_sniper = ["fixtures/*.json", "README.md"]
